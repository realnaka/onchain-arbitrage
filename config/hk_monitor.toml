[monitor]
# Bybit / Bitget joined 2026-09-16 (operator: "也监控 bybit 和 bitget 的股票合约，
# 看看哪里的交易机会比较多"). Both are read-only here: neither has an execution
# adapter, and the executor's allowlist (`config/automation_policy.toml
# [allowlist] venues`) still contains okx only. Measured on that day: Bybit lists
# 6 of our 6 assets, Bitget lists the same 6 (plus HKD-number siblings, which are
# excluded — a different instrument on a different ruler). Bitget reads through
# its V2 mix endpoints; V1 answers "The V1 API has been decommissioned".
# Aster / Hyperliquid / Lighter joined 2026-09-17 on the operator's instruction
# ("Aster / Lighter / edgeX / HL 要接成只读行情"). All three are read-only here:
# none has an execution adapter and the allowlist venues stay ["okx"]. Measured
# coverage of our six HK names on that day:
#   aster        POPMART, XIAOMI, TENCENT, MEITUAN, KUAISHOU
#   hyperliquid  SHEIN only (HIP-3 builder dex "xyz")
#   lighter      XIAOMI, TENCENT, POPMART, SHEIN
# edgeX was probed and is *not* listed: its public meta has 293 coins, none of
# them ours, so there would be nothing to read.
#
# gate removed 2026-09-22 (operator: "之后不需要再监控 gate 这个交易所，我决定
# 不使用这个交易所"). This is a *scope* change, not a bug fix: the adapter
# (`data/hk_cex.py`) and the reviewed `gate:` mapping blocks below are left in
# place as evidence, but nothing reads Gate any more — no contract catalogue, no
# perp book, no funding rate, and no `basis_evaluation` row. Two consequences
# worth knowing before quoting anything:
#   * the venue-opportunity scoreboard's Gate column stops at the moment of the
#     restart and will keep showing a stale rate until the window rolls past it;
#   * `docs/venue-selection-2026-09-20.md` ranked Gate ≈ Bitget first (538 ≈ 518
#     candidates). That ranking is still the historical measurement it was, but
#     Gate is no longer a candidate venue for this project, so S1 (picking a
#     venue to write an execution adapter for) now reads: bitget first.
# 2026-09-23 operator: 先不监控其他交易所，只留 X Layer 现货 + OKX 永续。
# 其余场所的适配器和历史映射块仍在仓库里，只是这一轮不采集。
venues = ["okx"]
# Scope since 2026-09-22 (operator: "现在开始对这114个公司也进行监控"): the grid is
# no longer Hong Kong only. The seven reviewed US blocks are in the list below
# and their 107 reviewed-pending peers arrive through issuer discovery
# (`token_adopt_markets` now includes US), gated twice — OKX must quote a stock
# perp for the name, and its X Layer pool must clear `min_pool_depth_usd`.
# Machine-adopted US names rotate through the quote grid instead of joining it
# every cycle (`quote_slice_markets` below); everything they cannot do yet is
# stated per row: `mapping_verified = false`, no execution allowlist entry, so
# they are screened and displayed, never executable.
# `probe_shares = ["1"]` a monitored asset costs two OnchainOS CLI probes per
# cycle, and the 60-second batch has one shared local proxy. Measured 2026-09-16:
# 32 probes took 17.4 s against a 15 s pairing budget.
#
# 2026-09-22 (operator: "现在开始对这114个公司也进行监控"): the seven reviewed US
# names below are now in this list, so the grid goes from 12 probes to 26 and the
# US row is priced every cycle. The other 107 US candidates do **not** enter this
# list: they arrive through issuer discovery (`token_adopt_markets` now includes
# US) and their probes rotate through `quote_slice_assets_per_cycle`, so a market
# that is only being screened cannot multiply the grid by its name count.
assets = [
  "XIAOMI", "TENCENT", "POPMART", "MEITUAN", "KUAISHOU", "SHEIN",
  "AAPL", "NVDA", "TSLA", "MSFT", "AMZN", "META", "GOOGL",
]
# Independent quote probes, not three concurrent positions. Capital is split,
# not doubled; margin allocation is distinct from hedge notional.
# The live probe is not this list. `probe_from_contract_minimum` quotes each
# contract at its own OKX floor: sz >= minSz and a multiple of lotSz, converted
# to a token amount that hedges exactly. There is no separate USD minimum on
# OKX SWAP. The cash ceiling (`per_trade_quote_usdt`) raises that size when the
# last bid is known; if that larger exact-out reverts, the probe falls back to
# the contract minimum. One whole share is not the floor.
# `probe_shares` remains only for the legacy batch helper and its tests.
probe_from_contract_minimum = true
probe_shares = ["1"]
# 轮转报价切片（operator，2026-09-22："现在开始对这114个公司也进行监控"）。
#
# 每条报价探针都是一次 OnchainOS CLI 往返，走的是 60 秒采样循环也在用的同一条
# 本地代理。实测（2026-09-22）：港股 6 个标的 = 12 条探针 ≈ 6-12 秒/轮。若把
# 114 个美股按同样口径每条都发，就是 228 条探针 ≈ 4 个 worker 的 55 波，一轮要
# 好几分钟——先老化的会是港股自己那条腿的报价。
#
# 所以 `quote_slice_markets` 里的市场按游标轮转：每轮只报
# `quote_slice_assets_per_cycle` 个"发现来的"标的，N 个名字在 ceil(N/slice)
# 轮内走完一遍，单轮永远不会多出 slice 条。手写块（`mapping-verify` 走过的那 7
# 个美股 + 港股 6 个）不参与轮转，照旧每轮都报。
# 114 ÷ 3 ≈ 38 轮 ≈ 38 分钟走完一遍；轮转位置写在
# `run_summary.quote_grid_slice`，所以"这轮报了哪几个美国名字"是可查的，不靠
# 缺失的行去猜。
quote_slice_markets = ["US"]
quote_slice_assets_per_cycle = 3
# OnchainOS 精确报价是执行用的，不是“把 100 多个名字标上价”的通道。
# 2026-09-23 实测：一轮 16 个名字、32 条探针，批次 15239 ms，超过 15 s 新鲜度，
# 并发被自适应降到 2，并持续 Rate limited。所以精确报价只发给下面这 6 个
# 已经在执行资产名单里的港股。美股和其余名字的价格走 OKX 一次 tickers
# 加上池子 slot0（run_summary.price_screen），不进下单报价。
quote_exact_assets = [
  "XIAOMI", "TENCENT", "POPMART", "MEITUAN", "KUAISHOU", "SHEIN",
]
# Notional ladder for the depth table. These are computed from the pool's own
# state (slot0 + liquidity), so they cost no quote probes and can stay useful
# at sizes we would never send.
depth_sizes = ["4", "100", "500", "1000"]
# Quote probes are CLI round trips; they run concurrently. Sequentially the
# grid took ~70s, which aged every order book past the pairing budget.
# Measured 2026-09-15: 12 concurrent probes → the venue answers
# "Rate limited — retry with backoff"; 6 concurrent probes → the local proxy
# starts answering "Network unavailable". 4 keeps both quiet.
#
# 2026-09-21: this is now the **ceiling**, not a fixed value. The grid may be
# narrowed by the adaptive controller (`quote_concurrency` in the summary) when
# a window of rounds is over budget, rate-limited or missing its deadlines, and
# widened back towards this value when the window is calm. It is never raised
# above the number written here: the operator's instruction was not to answer a
# slow grid with more concurrency against the same proxy.
quote_workers = 4
# Narrowest the grid may be narrowed to. Below 2 the buy/sell legs stop
# overlapping at all.
quote_workers_min = 2
# Wall-clock budget for ONE asset's buy+sell probe. The batch budget bounds the
# round; this bounds a single asset, so a stuck asset releases its worker instead
# of holding it until `market_batch_budget_seconds`. A probe that misses it is
# recorded as that asset's miss (`quote_asset_deadlines_missed`), never as a
# price and never as the previous cycle's quote.
quote_asset_deadline_seconds = 12
# Alternating venues (operator, 2026-09-17: "现在就做隔轮采样").
#
# These three are read every 2nd cycle (~2 minutes instead of ~1). On the cycles
# they are skipped they are *not evaluated at all*: an absent row means "not
# sampled", never "no book existed". The run summary carries
# `sampled_venues` / `skipped_venues` so the gap is explicit.
#
# MEASURED OUTCOME, same day — read this before believing it fixed anything:
# it did not. The intent was to bring the spot quote batch back under its 15s
# freshness budget, and the batch time is **not** driven by how many perp venues
# are polled. Over 7 consecutive cycles after the change: full cycles 6.0/7.4/
# 11.6s, skip cycles 6.1/6.2/10.8/**31.5s** — a skipped cycle was the slowest of
# all. The rejection breakdown says why: on an 11.6s batch, 28 of 39 rows died on
# `missing_or_stale_spot_buy_quote` (+15 on the sell side), while perp-book
# staleness stayed at its constant baseline of 5 (the unmapped HKD siblings). The
# bottleneck is the 16 OnchainOS CLI probes (8 assets × 2 sides, 4 workers = 4
# sequential waves), whose per-wave latency swings by 5x.
#
# Kept anyway because it does cut total proxy load and rate-limit pressure (one
# `quoting_rate_limited` was observed without it) at no cost to the three venues
# that trade a few hundred shares a day. It is NOT the fix: that has to target
# the quote grid. See docs/research/perp-dex-venues-2026-09-17.md §5.
#
# Trade-off to remember: a venue sampled every 2nd cycle has half the samples
# over the same window, so its opportunity *rate* is comparable but its absolute
# run counts are not. The scoreboard already normalises by per-venue sampled
# cycles for exactly this reason.
alternate_venues = ["aster", "hyperliquid", "lighter"]
alternate_every_cycles = 2
# Perp reads are flattened into one bounded pool (operator, 2026-09-17: "把每合约的
# depth/funding 并发发出"). Before this, each venue had one thread with
# depth-then-funding serial inside it: gate's 8 contracts were 16 sequential HTTP
# calls (measured 3.2s), bitget's 6 were 12 (3.4s), and `evaluated_at` waits for
# the slowest venue — so those seconds aged every spot quote fetched alongside
# them (measured: last quote landed 8.7s before `evaluated_at`, quotes reaching
# 10.6-13.8s against a 15s budget).
#
# The bound matters more than the parallelism: all these reads share this
# machine's one local proxy, so an unbounded fan-out would trade one slow leg for
# a broken one. Raise it only with a measurement in hand.
perp_workers = 8
# Instrument metadata is discovery-only and must not hold the 60-second
# sampling loop when one catalogue endpoint stalls.
metadata_budget_seconds = 20
# Hard wall-clock budget for one CEX/public quote batch.  A slow provider is
# recorded as a missing sample; it must not hold the 60-second monitor loop.
market_batch_budget_seconds = 30
# Funding reprices on an 8-hour clock and nothing in this process reads the
# events back (`funding_exit` queries OKX directly), so re-reading it every cycle
# was ~40% of all perp calls for data nobody consumed at that rate. On the venues
# without an execution adapter it is display-only to begin with. A failed read is
# retried on the next cycle — "could not read" is never remembered as "read".
funding_refresh_cycles = 20
# Bounded retries for read-only quotes. Writes get zero retries; quotes are
# reads, so a jittered backoff is allowed and is the difference between a
# measured price and a hole in the grid.
quote_retries = 3
quote_backoff_ms = 600
total_capital_usdt = "10000"
spot_allocation_usdt = "5000"
margin_allocation_usdt = "5000"
max_age_ms = 15000
max_pair_skew_ms = 10000
quote_ttl_ms = 10000
min_net_edge_bps = "20"
# Operator 2026-09-24: 1 USDT is too high for the current wallet. 0.1 is a
# test floor so a small live round trip can be observed. Raise it again
# before treating the book as a normal size.
min_net_profit_quote = "0.1"
max_unhedged_bps = "5"
# Operator 2026-09-24: a long residual worth at most this may still open.
# A short larger than the spot is still refused at any size.
max_unhedged_quote_usdt = "0.5"
signal_cooldown_ms = 60000
interval_seconds = 60
metadata_refresh_seconds = 1800
# Reference data is evidence, not a fill quote: a token search hit, a pool's
# reserve, a daily candle. Measured 2026-09-21: refreshing it inside the cycle
# stretched those cycles to 347–1 009 s (interval is 60 s), which is how the
#采样 cadence got lost. It now runs on a hard `reference_budget_seconds` budget
# and on a slower clock, because nothing downstream needs a five-minute-old
# daily candle to be five minutes fresher.
#
# 2026-09-21 (stability round, stage 1): the refresh now runs on its own worker
# thread. Only the FIRST round after a start is inline — `reference_cache`
# decides whether an asset can be screened at all, and starting up with an empty
# table for a whole cycle would be a new gap rather than a fix. Later rounds are
# adopted by whichever cycle follows their completion, so a slow public host no
# longer holds the sampling loop. Per-host concurrency and cooldowns live in
# `data/hk_reference.py`: `Retry-After` is honoured, the backoff is jittered, and
# a host with a failure streak gets exactly one probe request at a time.
reference_refresh_seconds = 900
reference_budget_seconds = 20
# Concurrency of the reference fan-out. Tasks are submitted in tier order
# (`token_reference` → `pool_reference` → daily candles), so this bounds the
# whole round without letting the display-only reads take a worker from the
# token identity that an executable candidate depends on. Per-host caps are
# enforced separately, on top of this.
reference_workers = 4
# On-chain is the only 24/7 leg, so it is refreshed on its own clock and keeps
# running when the HK/US cash sessions are closed.
onchain_refresh_seconds = 60
# Pool state is a pricing input, so a cached result is never used indefinitely
# while the background RPC is stalled.  Two refresh periods is the maximum age.
pool_state_max_age_ms = 120000
db = "data/hk_monitor.db"
# No private exchange keys. Pass --proxy or ARB_HTTP_PROXY at runtime.

[onchain]
enabled = true
# Read-only JSON-RPC. No wallet, no key, no transaction is ever sent.
rpc_url = "https://rpc.xlayer.tech"
chain_id = "196"
# Uniswap-V3-style factory used by the reviewed xStocks pools below.
factory = "0x4b2ab38dbf28d31d467aa8993f6c2585981d6804"
# Cycle quotes call this QuoterV2 (eth_call). Its factory() is the address
# above, checked 2026-09-23. Order signature and broadcast stay on OnchainOS.
pool_quotes = true
quoter_v2 = "0xd1b797d92d87b688193a2b976efc8d577d204343"
# A pool below this measured depth is not a price: several X Layer xStocks
# pools are initialized but hold nothing.
min_pool_depth_usd = "50"
min_trade_notional_usd = "10"
# eth_getLogs is capped at 100 blocks per call on this RPC (≈100s at 1s blocks).
trade_lookback_blocks = 300
max_prints_per_asset = 8
# Issuer token-universe re-scan: new xStocks listings that already have a pool
# with depth are hot-added to price monitoring and announced on Feishu.
token_scan_seconds = 1800
# Only listings in these markets are probed; a full re-probe of names that
# still have no pool runs every N scans (24 x 30min = 12h).
# The market is the issuer's `underlying.listingCountry`. On 2026-09-15 the
# issuer listed 832 assets: US 741, HK 79, GB 1, and 11 US names with the
# country left null — those stay UNKNOWN and are excluded, never guessed.
# 2026-09-22（operator 的"美股代币 × OKX 永续扩展计划"）：US 加入**只读扫描**。
# 同日 operator 进一步指示"现在开始对这114个公司也进行监控"，所以 US 也进了
# `token_adopt_markets`（见下）：闸门命中 + 池深度达标的美股 listing 会被写进
# config/discovered_tokens.toml 并进价格监控。扫描范围与采纳范围仍然分开写，
# 是为了让"扫了但不采纳"永远是一个可表达、可核对的状态，而不是一个隐含默认。
# 完整计划见 docs/research/us-mapping-2026-09-22.md。
token_scan_countries = ["HK", "US"]
# 探测闸门：先取交集，再扫价格（operator 2026-09-22 要求）。
# 发行方列 754 个美股代币，OKX 只有 181 个股票永续（`instCategory = "3"`），
# 两者按「发行方 underlyingSymbol == OKX ctValCcy」取交集是 **114** 个
# （另加 SHEIN 的按名匹配 → 115）。这 114 个才可能成为双腿，其余 640 个扫出来
# 也只能是不可对冲的行，而扫一遍要花约 19 小时共用代理的时间。
# 因此这里列出的市场，必须先在 OKX 股票永续名单里命中才会被探测。
# 只列 US：HK 的可对冲集合还包括 Bybit/Bitget（Gate 已于 2026-09-22 停用，见
# `venues`），探测范围允许比任何单一场所宽。OKX 名单读不到时不放行（未知 ≠ 可以
# 全扫），错误写进
# `run_summary.token_universe_scan.perp_gate.error`。
# 名单与交集表见 docs/research/us-okx-overlap-2026-09-22.md。
token_scan_perp_gate_markets = ["US"]
# 允许被热加入价格监控的市场。2026-09-22 operator 指示："现在开始对这114个公司
# 也进行监控"，因此 US 从"只读扫描"改为"可采纳"。
#
# 采纳仍然有闸门，而且不止一道：只有在**交集 114 之内**（`token_scan_perp_gate_markets`
# 先按 OKX 股票永续筛过）、并且 X Layer 池**深度 ≥ min_pool_depth_usd** 的 US
# listing 才会被写进 config/discovered_tokens.toml 并进入价格监控。所以"114"是
# 上限而不是承诺数：没有池深度的名字扫出来只会进
# `run_summary.token_universe_scan.skipped_no_depth`。
#
# 监控 ≠ 可执行：被采纳的 US 名字 `mapping_verified = false` 且不在执行白名单里，
# `execution_blockers()` 会写"份额映射未核验"。执行白名单、额度、开关都没动。
token_adopt_markets = ["HK", "US"]
# 哪些被采纳的市场同时做 `eth_getLogs` 真实成交打印扫描。这个扫描很贵（实测
# 2026-09-21：300 区块回溯、8 个标的要 43-176 秒，因为该 RPC 把 eth_getLogs
# 限制在 100 区块），而美股这一批刚进来时一个都不能执行——先花归档 RPC 换 100+
# 个名字的成交打印没有意义。港股照旧（这是原本的行为）。要打开美股就直接往这里
# 加 "US"，重启即生效。
token_adopt_trade_scan_markets = ["HK"]
# 1 = 每轮都在游标位置继续扫"范围内、还没被监控"的 listing。这正是 US 加入
# 扫描后必须的口径：`token_scan_full_every = 24` 时只有"全新 listing"会被探测，
# 被上限截掉的积压要等下一个整轮（12 小时）才轮到，一遍 US 宇宙要几十天。
# 闸门生效后一遍要探测的是 114+79 = 193 个 listing ÷ 20 ≈ 10 轮 ≈ 5 小时
# （闸门之前是 833 个 ≈ 20 小时），之后按游标持续重扫（有池深的名额会被
# report_only 一直报出来）。
token_scan_full_every = 1
# 单轮探测上限。本机所有请求共用一个本地代理、60 秒采样循环也在用它，所以
# 探测按"每轮 N 个 + 游标轮转"摊开：193 个未监控 listing ÷ 20 ≈ 10 轮 × 30
# 分钟 ≈ 5 小时扫完一遍，每轮只发 ~20 次 factory batch
# （`probe_pools_cheap` 把 4 个 getPool 合成一个请求）。
# 队列长度写在 `run_summary.token_universe_scan.probes_pending_after_cap`。
# 2026-09-23：采样循环不再为这 100 多个名字发 OnchainOS 探针，池子探测在
# 后台线程里跑。上一轮 cap=20 时积压还剩 151 个，所以一轮只看得到约 30 个
# 有池的名字。提到 100，让积压在一两轮扫描里走完；没有池的名字仍然只出现在
# OKX 价格表上，不会被写成可交易。
token_scan_max_probes_per_round = 100
discovered_config = "config/discovered_tokens.toml"
# Daily depth census (hk-depth-census). While this file is younger than
# depth_watchlist_max_age_hours, names it recorded as no_depth are not read
# again and the 30-minute universe probe stays idle. Missing or stale file:
# no filter. The census itself is a direct X Layer RPC read, not OnchainOS.
depth_watchlist = "data/depth_watchlist.json"
depth_watchlist_max_age_hours = 26

[notify]
# Alerts only fire on a positive net entry basis that clears min_net_edge_bps.
# A negative net basis is not executable, so it is never announced.
enabled = true
# Comma separated, e.g. "webhook,lark_cli" to notify both the group bot and a
# direct message. A channel without its credentials is dropped, not fatal.
channel = "webhook"
# 报警频道（与信号频道分开，2026-09-16 由 operator 指定）。
# 信号频道（上面的 channel）只发"有机会"：候选信号、新代币发现。
# 报警频道发"需要人处理"：人工审核（平仓失败/裸腿/未知状态）、自动执行停机、
# gas 失去赞助、孤儿挂单。两者用不同的群/机器人 webhook，避免"要立刻处理"的
# 消息被信号刷掉。
#   alert_channel: webhook | lark_cli | off（留空或缺少凭据时回退到信号频道，
#                  并在投递结果里标记 fell_back_to_signal —— 报警绝不静默丢失）
# 报警 webhook 同样是密钥，不写在这里：放在 config/notify.env 的
#   ARB_FEISHU_ALERT_WEBHOOK=...
# （scripts/run_hk_monitor.sh 启动时会 source 该文件并导出），或直接 export。
alert_channel = "webhook"
alert_webhook_url = ""
alert_lark_chat_id = ""
alert_lark_user_id = ""
alert_lark_identity = "bot"
# Bot identity is used because the local user token is expired; messages come
# from the app bot. Set lark_chat_id instead to post into a group.
lark_identity = "bot"
lark_user_id = "ou_fc878c61e20cd6947eadbcec01756d88"
lark_chat_id = ""
# The webhook URL is a secret and is NOT stored here. It is exported by
# scripts/run_hk_monitor.sh from config/notify.env (gitignored), or supplied as
# ARB_FEISHU_WEBHOOK in the environment.
webhook_url = ""
cooldown_seconds = 900        # same asset+venue is not re-announced within 15 min
# 「过门槛但不可执行」的标的用更长的冷却（operator 指定 4 小时，2026-09-16）。
# 这类消息是信息不是行动号召：实测 KUAISHOU 在 Gate 上毛基差 +97~111 bps，
# 但该场没有执行适配器、映射也未核验，15 分钟冷却在 100 分钟内发了 7 条几乎相同的
# 提醒。可执行的候选仍用上面的 15 分钟冷却——那种才值得立刻看。
# 如果某个标的后来变成可执行，它只需要跨过 15 分钟冷却即可提醒（两个计时器分开记）。
unexecutable_cooldown_seconds = 14400
max_alerts_per_cycle = 3

[retention]
# 原始事件只留最近 48 小时（operator 2026-09-28：再早的，只保留产生过信号的
# 行，没有信号的直接删）。信号行 = kind `alert`，以及 `basis_evaluation` 里
# status = conditional_signal。报价、盘口、资金费、run_summary、发现转储都不是
# 信号，超过 48 小时就删。意图账本 `opportunities` 不在这张事件表里，不剪。
#
# 删除前仍把统计写进 event_daily_stats / venue_daily_stats，所以「哪个场馆机会
# 最多」在原始行删掉之后仍然答得出来。监控进程每 interval_seconds 自己裁一次，
# 不占用采样线程；`arb-monitor db-retention` 仍可手工先 --dry-run。
#
# raw_hours 生效时，不再用按 kind 的天数或行数上限把这 48 小时切短。
enabled = true
raw_hours = 48
keep_signals = true
default_days = 2      # 只有拿掉 raw_hours 时才退回「按天」
batch_rows = 20       # 每批删除的行数。发现转储单条约 0.7 MB，批再大写锁会挡住采样
interval_seconds = 3600

[costs]
# Recalibrated 2026-09-15 against real fills (scripts/cost_calibration.py).
#
# Perpetual leg: six live XIAOMI-USDT-SWAP fills on the real sub-account were
# all taker (execType=T) and all charged 4.50000 bps. OKX's own schedule for
# this account reports level VIP1 taker = 0.045%. The model keeps 5 bps, i.e.
# 0.5 bps above the measured rate, instead of the previous unmeasured 8 bps.
perp_fee_bps = "5"
# Maker rate for the perpetual leg, used when `[orders] style = "maker_first"`:
# a round trip that rests both legs at the touch never crosses the spread, so it
# pays this instead of the taker rate above.
#
# Measured 2026-09-16 on this account: TWO maker fills, both 1.60 bps
# (`execType=M`) — 10:31:00 sell 3 @3.352 and, in the closing path this model
# was written for, 11:16:19 buy 3 @3.341 (fee -0.00160368 USDT). Taker fills
# stay at 4.50 bps. The model charges 2 bps, i.e. 0.4 bps above the measured
# rate, for the same reason the taker row charges 5 against 4.5: the schedule
# is not this project's to promise. No rebate is assumed either.
perp_maker_fee_bps = "2"
perp_maker_fee_measured = "1.6"
perp_maker_fee_measured_samples = "2"
maker_close_fill_seconds_measured = "147"
spot_roundtrip_spread_measured_bps = "11.29"
realized_roundtrip_bps_measured = "19.9"
# On-chain leg: the pool ask already carries the 0.05% pool fee, and no
# separate provider fee was visible in the receipt. Measured model-vs-fill on
# the 4 USDG test was +0.61 bps (the model was slightly more expensive than the
# realised price), so no extra spot surcharge is added - charging one would
# count the same cost twice.
spot_fee_bps = "0"
# Slippage and failure buffers are NOT yet measured at meaningful size: the
# quote predicted 1.170314949169009549 wXIAOx and the fill delivered exactly
# that, i.e. 0 bps against the quote, but that is a 4 USD order in a 300k USD
# pool. They stay at 5 bps each until a larger fill is measured.
slippage_bps = "5"
failure_bps = "5"
financing_quote = "0"
# Operator decision, 2026-09-16: funding is NOT part of the cost model — most
# intervals are ~0 on this asset ("在测算成本的时候不考虑资金费，因为大部分时间都是0").
# The protection against the exception is the funding-cost stop in
# config/automation_policy.toml ([funding_exit]): once the funding actually paid
# reaches 1 USD, the group is closed before the next settlement whatever the
# basis is doing. So this zero is a modelling choice with a separate stop behind
# it, not an assumption that funding never matters.
funding_cashflow_quote = "0"
# Gas on X Layer was measured as 0 (sponsored): receipt effectiveGasPrice=0 and
# l1Fee=0 on the approve, the spot buy and the spot sell of the 2026-09-15
# round trip. That is a current property of the chain/route, not a contract:
# it is written here explicitly (instead of left unknown) so the pairing gate
# can be evaluated, and `gas_watch` re-reads real receipts every 15 minutes and
# raises a red banner on the dashboard the moment any transaction pays gas.
#
# Verified 2026-09-16 against three complete round trips at 3 shares each
# (≈10.2 USDG), plus the earlier 1-share and 4-USDG cycles:
#   perpetual : 10 fills, every one taker, every one 4.50000 bps (VIP1 schedule
#               agrees). The model charges 5 bps, i.e. 0.5 bps conservative per
#               leg, 1 bp per round trip.
#   on-chain  : compared against the pool price at the same moment and on the
#               side actually traded — buys vs the ask, sells vs the bid — the
#               model is optimistic by ~0.95 bps on entry and conservative by
#               ~0.3 bps on exit. Net ~1.3 bps per round trip, inside the 5 bps
#               slippage buffer (which is a buffer, not a measurement).
#   round trip: realised 8.9 / 11.3 / 11.4 bps of spot spread against a model
#               prediction of ~10.7 bps.
#   gas       : 0 on every transaction we sent, re-checked continuously by
#               gas_watch, which turns the dashboards red if that ever changes.
# Scope: measured at ≤11 USDG per leg and with no funding-fee window crossed.
# The exit assumption (3 bps) is the operator's scenario, not a measurement.
verified = true
evidence = "2026-09-16 三个 3 股往返（约 10.2 USDG/腿）：永续 10 笔全 taker 全 4.5 bps（模型 5 bps）/ 链上腿与同时刻池价买卖两侧比较，模型开仓乐观 0.95 bps、平仓保守 0.3 bps / 现货往返实测 8.9–11.4 bps vs 模型 10.7 bps / gas 全程 0（gas_watch 持续复核）"
# The maker close (task A, 2026-09-16 11:13–11:16, XIAOMI 3 shares) adds the
# first measured *maker* round trip. Full decomposition, including what the
# 19.9 bps was made of, in docs/research/cost-calibration-2026-09-16-maker.md:
#   entry  taker sell 3 @3.341, 4.504 bps
#   close  maker buy  3 @3.341, 1.603 bps, filled after 147 s at bid1 (window 600 s)
#   on-chain buy 3.000752 shares for 10.051960 USDG, sell 3 shares for 10.038110
#          → realised round-trip spread 11.29 bps (model was ~10.7 at the time)
#   dust   0.000752 shares left unsold by whole-share sizing ≈ 2.5 bps
#   total  -0.01996 USD on ~10.04 USD notional = 19.9 bps, of which 6.1 bps is
#          perp fees and 11.3 bps the on-chain spread; the basis itself moved
#          +1.9 bps in our favour, which is why the two do not add to 19.9.
maker_evidence = "2026-09-16 11:13–11:16 XIAOMI 3 股平仓：挂 bid1 3.341，147 秒成交，maker 费率 1.603 bps（execType=M）；链上买 3.000752 枚花 10.051960 USDG、卖 3 枚得 10.038110 USDG，往返价差实测 11.29 bps（同期模型约 10.7 bps）；整股取整尘埃 0.000752 枚≈2.5 bps；gas=0。见 docs/research/cost-calibration-2026-09-16-maker.md"
perp_fee_bps_measured = "4.5"
perp_fee_measured_samples = "6"
spot_model_vs_fill_bps = "0.61"
gas_measured_usdt = "0"
# Explicit round-trip gas budget in USDT, backed by the receipts above.
# If X Layer stops sponsoring gas this value is wrong, which is exactly what
# gas_watch is for: it watches real receipts, not this number.
roundtrip_gas_budget_usdt = "0"
valid_until_ms = 1792166399000
[scenario]
# Exit policy, given by the operator on 2026-09-16: hold until the basis
# converges back to ~3 bps and close there. The strategy refuses to assume a
# future basis on its own, so the assumption lives here, explicitly, and the
# conditional profit is computed as: entry basis - assumed exit basis - costs.
# A smaller number is a stricter test; it is not a promise that convergence
# happens, only the scenario the entry is being judged against.
target_exit_basis_bps = "3"
exit_policy = "hold until net basis converges to <= target, then sell spot and buy back the entire short"

[strategy]
# Every trade has to carry a profit, not just break even. The alert threshold is
# therefore computed from three numbers, all of them editable here:
#
#   required gross basis = 往返成本(实测) + edge_buffer_bps + expected_profit_bps
#
# `edge_buffer_bps` is the allowance for the things that are not measured yet
# (fill slippage, the entry quote ageing, a maker order that has to be re-joined,
# the spot leg delivering a few bps more or less).
# `expected_profit_bps` is the reward the trade has to offer for the risk of
# holding it until the basis converges.
edge_buffer_bps = "5"
expected_profit_bps = "20"

[gas_watch]
# Sponsorship is a current property of X Layer, not a contract: re-read real
# receipts on a clock and warn if anything starts paying gas.
enabled = true
check_seconds = 900
history_limit = 10

[streams.lighter]
# Lighter is the only venue we read whose REST book has **no** time field at all
# (`/api/v1/orderBookOrders` returns code/total_asks/asks/total_bids/bids and
# nothing else — read off its OpenAPI definition on 2026-09-22). Until now the
# adapter anchored freshness to the market's latest *trade*, so a market that was
# being re-quoted but not traded read as stale — measured: 94.5% of Lighter's rows
# carried a stale flag over a 54-hour window, and the venue's own venue-level
# candidate rate (67.1%) came off 164 evaluable rows.
#
# Its WebSocket does publish a clock: each `update/order_book` frame carries
# `timestamp` (venue ms), `order_book.last_updated_at` (venue microseconds) and
# `offset`/`nonce`/`begin_nonce`. The monitor holds that subscription and stamps
# the REST book with the venue's own timestamp, read *before* the REST call.
#
# The frames are a clock, not a book: the venue documents that this channel sends
# "a complete snapshot on subscription, but only state changes after that", and
# the live frames bear that out (TENCENT/XIAOMI usually arrive as one side with
# 1–3 levels). Rebuilding a book from those deltas would mean trusting a nonce
# chain we cannot replay — a missed update silently becomes a wrong book — so
# levels stay on the REST snapshot and only the clock comes from the socket.
# Read-only: subscribe, keepalive ping, no transaction.
#
# This does not loosen any gate. A book the venue has not re-published inside the
# strategy's own `max_age_ms` (15 s) is still rejected — see risk/hk_basis.py.
enabled = true
url = "wss://mainnet.zklighter.elliot.ai/stream"

[probe]
# Exact liquidity-source names/IDs from verified provider responses.
# Empty means UNKNOWN; an AMM route is never proof of the xStocks RFQ channel.
special_route_ids = []
anchor_tolerance_bps = "20"
min_overnight_move_bps = "50"
min_observations = 3


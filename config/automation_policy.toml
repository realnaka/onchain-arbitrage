# Hard limits for unattended execution. Values are deliberately conservative.
[execution]
mode = "off"
# Unattended execution is gated by **two** independent keys, both of which have
# to be set deliberately before the monitor loop is allowed to place an order by
# itself:
#   mode        = "preauthorized_program"   ← the program is allowed to sign
#   auto_orders = "paper" | "live"          ← and this is what it may do
# "paper" uses the live quotes and the live cost model but moves no money;
# "live" is the real thing. Anything else (including the default "off") leaves
# the monitor read-only, which is what it has been until now.
# Step 2 of 2, enabled by the operator on 2026-09-16 (see `live_ack` below).
# History: this ran as "paper" (real quotes, real risk, real ledger, no money)
# from 2026-09-16 morning until the P0 remediation in
# docs/p0-remediation-2026-09-16.md closed the five "half-finished trade looks
# finished" paths. Rolling back is one edit: set this to "paper".
auto_orders = "off"
auto_max_per_cycle = 1
# Who runs the execution body (2026-09-21, stability round stage 3).
#   "inline" — the historical shape: the sampling cycle calls
#              `maybe_execute` / `maybe_funding_exit` / `maybe_basis_exit` itself
#              and waits out any maker-first order. A resting open waits up to
#              `maker_timeout_seconds` (120 s) and a resting close up to
#              `maker_close_timeout_seconds` (600 s), so during that window the
#              monitor writes no run summary and ages every order book.
#   "worker" — the same three calls run on `execution/worker.py`'s single serial
#              thread, over a bounded, priority-ordered, deduplicated queue.
#              Exits outrank entries and an exit is never evicted to make room
#              for an open; a task kind this version does not recognise is
#              refused rather than guessed at; a dead worker stops new *opens*
#              (closing stays available) and says so in the summary.
# The execution semantics do not change: same gates, same risk checks, same
# 15-second freshness limits, same unknown-write -> AUTO_HALT rule.
#
# Set to "worker" by the operator on 2026-09-21 (stability round stage 4): the
# live chain now runs execution on its own thread, so a resting maker order no
# longer freezes the sampling loop. Covered by tests/test_execution_worker.py.
dispatch = "worker"
# Queue capacity in worker mode. Small on purpose: the monitor re-nominates
# every cycle, so a backlog is never useful, and "平仓优先于开仓" is enforced at
# this boundary too.
worker_max_pending = 2
# How long `stop` may wait for an in-flight execution task to finish before the
# process leaves. It waits; it never cancels. An order that was sent stays on the
# venue — pulling orders on shutdown would be a new way to leave a half-finished
# hedge, and the maker-first timeout / taker fallback already own that decision.
# If the wait runs out, the task is written to the ledger as
# `execution_shutdown_interrupted` and the next start's reconciliation gate
# (pending orders + unresolved groups, both read from the venue) stops any new
# open until it is accounted for. Keep this below the stop script's SIGKILL
# timeout; `scripts/hk-monitor-ctl.sh` waits `grace + 10 s` before forcing.
shutdown_grace_seconds = 20
# Live needs two more deliberate values on top of `auto_orders = "live"`:
#   auto_close_policy — who closes a position. Plan A was set on 2026-09-16
#     (a human closes, with the funding-cost stop as the one exception).
#     **Changed by the operator on 2026-09-21**: the program closes on the
#     basis target too — see `[auto_close]` below. A human is now only for
#     failures, which is what this project always said it would grow into.
#   live_ack — the record of who accepted those terms. Empty means `live` is
#     refused outright (verified in tests/test_auto_execute.py), so this is the
#     field that turns unattended signing on and off.
auto_close_policy = "program_close_on_basis_target_plus_funding_cost_stop"
live_ack = ""
# Paper fills are modelled money: they are tracked on their own (paper_used) and
# no longer consume `[limits] daily_quote_usdt`. Measured 2026-09-16: four paper
# groups had put the live board at 90.252212/100 without moving any money.
paper_budget_separate = true
# The unattended executor calls `account-status`'s own snapshot before it acts
# and refuses to start when `verified` is false.
require_verified_account = true
# A basis that clears the bar usually stays above it for a while, so without a
# cooldown one signal becomes one trade per cycle (measured 2026-09-16: the
# paper chain fired on the same SHEIN signal at 12:00:25 and again at 12:00:42).
# The cooldown is per asset, remembered in memory for the running loop and read
# back from the ledger after a restart.
auto_cooldown_seconds = 900
# Any unknown state (an order that cannot be read, a spot leg that did not
# confirm) writes this file and stops all further automated execution until a
# human reconciles the ledger and deletes it. The lock file makes an execution
# exclusive, so two processes can never act on the same signal.
auto_halt_file = "data/AUTO_HALT"
auto_lock_file = "data/auto_execute.lock"
spot_must_confirm_before_hedge = true
unknown_state_action = "stop_and_reconcile"
kill_switch_file = "data/KILL_SWITCH"


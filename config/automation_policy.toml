[limits]
# Gray-scale ceiling, raised 2026-09-17 (operator): "灰度单笔上限 10 USD改为100USD".
#
# Why it changed: the venue tally showed every opportunity in the window clearing
# 20 bps but *none* reaching the project's own `min_net_profit_quote = 1` USDT —
# the best one (gate KUAISHOU, 217 bps) is worth 0.217 USDT on a 10 USDT position.
# The measured notional needed to reach 1 USDT of profit was ≈83 (gate) / 91
# (bitget) / 94 (bybit) / 873 (okx, whose edges sit near the threshold).
# See docs/venue-opportunity-scoreboard-2026-09-16.md §3.5.
#
# The number is a CEILING, not a share count. The size of a trade is the largest
# whole-share count whose spend fits inside it AND inside the wallet balance —
# so at XIAOMI ≈3.35 this is 29 shares (≈98 USDG), and a cheaper share buys more.
# It is also bounded by the wallet: the X Layer leg pays from the same balance.
# Operator 2026-09-24: each stock trade is at most 10 USDT on the spot buy
# and at most 10 USDT of hedge notional. Was 100.
per_trade_quote_usdt = "10"
# Daily ceiling 50 (operator, 2026-09-16): up to ~5 such trades a day, or fewer
# when each is larger. Counts *real* buy fills only; paper sits in
# paper_used_quote. Today's real spend (60.804037, the manual live round trips
# plus the drill) already exceeds it, so the unattended chain stays idle until
# 00:00 HKT — the quota is a gate for the machine, not for a human at the CLI.
#
# Raised 50 -> 1000 (operator, 2026-09-17: "daily_quote_usdt改为1000"). The old
# 50 was below the new per-trade ceiling of 100, and the gate is
# `spent + size_quote > daily_cap -> refuse` (auto_execute.py:391), so 0 + 100 >
# 50 refused every trade. 1000 is the operator's number, not a derived one.
#
# Note what actually binds first: the *wallet*. X Layer's USDG balance was 10.92
# on 2026-09-17 and the entry size is min(ceiling, wallet x 0.999), so the real
# per-trade size is ~10.9 until the operator funds it (their call: "钱包先不动，
# 你先统计信号，信号足够了再加钱"). The daily cap is therefore not the binding
# constraint yet — this raise makes it stop being a *contradiction*.
daily_quote_usdt = "1000"
max_slippage_bps = "50"
max_unhedged_tokens = "0"
# How much unhedged *long* dust one entry may leave behind, in bps of the hedged
# token count. The exact-in route is sized to deliver at least N shares, so it
# usually delivers a hair more (measured 2026-09-16: 0.000752 shares on 3, i.e.
# 2.5 bps). The other direction — fewer tokens than the contracts need, a naked
# short — has no tolerance and halts at any size.
max_unhedged_bps = "5"
# Operator 2026-09-24: long dust at or under this cash value is still hedged.
# The shortfall direction (spot < contracts) has no cash tolerance.
max_unhedged_quote_usdt = "0.5"
max_open_contracts = "1"
quote_ttl_seconds = 300

[orders]
# Maker-first (changed 2026-09-16 on the operator's instruction).
#
# Measured: the perpetual's bid/ask spread is the dominant cost of a round trip
# — 41 bps per side on SHEIN-USDT-SWAP, up to 48 bps on XIAOMI when the book is
# thin — because one tick is 0.01 and 0.001 against a price of ~4.8 and ~3.36.
# Crossing it twice cost more than every fee plus the whole on-chain spread.
# Resting on the offer earns that spread and collects the maker rebate
# (-1.6 bps on this account) instead of paying the 4.5 bps taker fee.
#
# What this changes: the hedge now exists BEFORE the spot leg, which inverts the
# project's oldest invariant. The naked window is bounded by code —
# post-only (can never cross), a hard timeout, no chasing, and an immediate
# taker unwind if the spot leg fails.
style = "maker_first"
# Operator 2026-09-24: opens use 1x. The account default had been 3x.
open_leverage = "1"
perp_order_type = "post_only"
perp_price_source = "best_ask"
perp_max_slippage_bps = "20"
allow_maker_orders = true
allow_resting_orders = true
# Bounds on the resting order. These are the price of the saving.
# Waiting is the cost of the saving. Measured 2026-09-16: a 3-contract offer at
# the touch went unfilled for 16s in a quiet book. This is the knob that trades
# "spread paid" against "position never opened".
maker_timeout_seconds = 120
maker_poll_seconds = 1
# Operator's decision, 2026-09-16: "以后保持只挂单、不成交就算了". Opening has NO
# taker fallback on purpose — measured 2026-09-16 17:36/17:39, two live attempts
# rested the offer, were pulled as would-cross three times each, and ended as
# `maker_unfilled` with filled=0, no spot bought and residual 0. That is the
# intended outcome: a missed basis is free, a crossed spread is not. (Closing is
# the opposite — it has a taker fallback — because there the position already
# exists and must be finished.)
maker_open_taker_fallback = false
# Re-join the new best ask when the venue pulls an unfilled post-only order
# (measured: a price read from the plan arrived below the bid and was cancelled
# as would-cross). Bounded, and never adverse to the resting price.
maker_max_reprices = 3
maker_unwind_on_spot_failure = true
maker_max_naked_seconds = 90    # spot leg must complete inside this window

# Closing is the same idea with different economics, so it has its own knobs.
# Measured 2026-09-16 / operator's instruction: when it is time to exit, the
# spot price and the perpetual price are close to each other and stay that way
# for a while. There is no reason to hurry, and chasing the bid downward to get
# filled would hand back the spread the resting order is there to earn.
maker_close_timeout_seconds = 600      # 10 minutes: how long the bid may rest
maker_close_fallback = "taker"         # on timeout: cancel, taker buy-back, then sell spot
maker_close_poll_seconds = 2
maker_close_max_reprices = 0           # closing never chases; 0 = rest once, then fall back
# Selling the spot after the perpetual is already flat carries no hedge at all,
# and the usual reason a sale fails is transport, not the market. So it is
# retried — 5 times, with a widening pause — before a human is asked.
# Measured 2026-09-16: a quote call answered `api_failed_or_confirmation_required`
# once during the day, which is exactly the class of failure this covers.
# The retry is safe because each attempt re-reads the wallet balance and sells
# only what is still held, so a lost broadcast cannot be replayed into a
# double sale.
close_spot_retry_attempts = 5
close_spot_retry_backoff_seconds = 2   # attempt 1→2 waits 2s, 2→3 waits 4s, ...

[auto_close]
# Operator's rule, 2026-09-21 (verbatim):
#   "我们开仓的时候，应该是要求现货和期货之间的价格差达到 20 个 BPS 的价差才开仓；
#    平仓的时候，要求这个价差恢复到 3 个 BPS。"
# The entry half is `[monitor] min_net_edge_bps = 20` and is unchanged.
# The exit half is executed by the unattended loop through the same reviewed
# close path the manual CLI uses (`maker_first_close`, reduce-only, taker
# fallback per `[orders] maker_close_fallback`), with three rails:
#   * the basis is read on the *execution venue only* — never the best venue in
#     the table, which would price a trade we cannot make;
#   * an evaluation carrying a data-quality flag (stale book, non-simultaneous
#     legs, unverified mapping, expired costs) is an alert, never a close;
#   * "no observation" is not a signal to close.
# `target_exit_basis_bps = 3` is the operator's number and it is also what every
# entry plan already assumes (`assumed_exit_basis_bps`), so the exit realises the
# basis the entry was priced on.
enabled = true
target_exit_basis_bps = "3"
max_quote_age_ms = 15000
cooldown_seconds = 300

[funding_exit]
# Operator's rule, 2026-09-16:
#   "如果持仓期间资金费率为负（我们持有的空头需要支付资金费率），而支付的资金费
#    累计达到 1 美元，那么在下一次资金费率收取之前的倒数一分钟，如果仓位还存在，
#    不管当前套利组合的损益情况，直接平掉仓位。"
# Negative funding = the short pays (on OKX a positive rate is the short being paid).
# Once the funding we have actually paid reaches `threshold_quote`, the position is
# closed unconditionally at `lead_seconds` before the next settlement — this is a
# cost stop, so it may realise a loss on the basis, on purpose.
#
# `threshold_quote` is the operator's number (1 USD) and is not a value this
# project derived; the paid amount itself is read from the account's own funding
# bill lines (type=8), never from a model.
enabled = true
threshold_quote = "1"
lead_seconds = 60
require_negative_rate = true

[approval]
# Never use unlimited approval. Reuse is allowed only within this cap and after
# reading allowance back for the current quote spender.
mode = "bounded_preapproval"
# 110 -> 101 (operator, 2026-09-18: "把授权改为101USD，避免更多卡住的订单").
# 101 is the number that has to hold: the per-trade ceiling is 100, so one
# approval covers any single trade the policy can size and still fails closed
# above it. Why it matters at all: the allowance was previously whatever a
# manual run happened to leave behind, and on 2026-09-18 the auto chain spent
# 10.34 USDG of a 1.006008 USDG remainder — the swap reverted, the perpetual
# leg had already filled, and the unwind cost 0.0264 USDT. The auto chain still
# does NOT top this up itself (that would be a new signing authority); it now
# refuses the candidate before the perpetual order and tells the operator.
max_allowance_quote = "101"
require_allowance_readback = true
require_spender_allowlist = true
allowance_revoke_after_cycle = false

[network]
routes = ["http://127.0.0.1:4780", "socks5://127.0.0.1:4781", "direct"]
read_retries = 2
write_retries = 0
unknown_write_action = "query_id_then_stop"
